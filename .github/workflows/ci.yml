name: VANAD Build Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-architecture:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # NEW: The AI Model Safeguard
    - name: Verify ML Model Artifact Exists
      run: |
        if [ ! -f "artifacts/revenue_model.joblib" ]; then
          echo "❌ CRITICAL: Predictive model artifact not found!"
          echo "The FastAPI backend requires 'artifacts/revenue_model.joblib' to launch."
          echo "Please run train_model.py locally and commit the generated artifact."
          exit 1
        else
          echo "✅ ML model artifact located successfully."
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install --legacy-peer-deps
        
    - name: Build React App
      working-directory: ./frontend
      run: npm run build

    - name: Test Docker Compose Build
      run: docker compose build