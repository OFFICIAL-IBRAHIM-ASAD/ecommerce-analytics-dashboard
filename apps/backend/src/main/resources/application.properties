# ----------------------------------------
# Database Connection (with env var fallbacks)
# ----------------------------------------
# Syntax: ${ENVIRONMENT_VARIABLE:default_fallback_value}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:analytics_db}
spring.datasource.username=${DB_USER:ibrahim}
spring.datasource.password=${DB_PASSWORD:super_secret_password_123}

# ----------------------------------------
# Hibernate / JPA Settings
# ----------------------------------------
# 'update' automatically creates/updates database tables based on your Java models
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=truespring.application.name=analytics-api
